<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindflow — マインドマップ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span><span>mindflow</span></div>
      <div class="title-wrap">
        <input id="map-title" aria-label="現在のファイル名" value="無題のマップ" readonly />
        <span id="save-status" role="status">変更なし</span>
      </div>
      <div class="header-actions">
        <button id="undo-btn" class="quiet" title="元に戻す (Ctrl+Z)" disabled>↶ 元に戻す</button>
        <button id="redo-btn" class="quiet" title="やり直す (Ctrl+Shift+Z)" disabled>↷ やり直す</button>
        <button id="import-btn" class="quiet">開く</button>
        <button id="export-btn" class="save-button">名前を付けて保存</button>
        <button id="overwrite-btn" class="quiet" disabled>上書き保存</button>
        <button id="auto-save-btn" class="quiet" aria-pressed="false">自動保存 OFF</button>
        <button id="export-png-btn" class="quiet">PNG</button>
        <button id="export-pdf-btn" class="quiet">PDF</button>
        <button id="new-btn" class="primary">＋ 新しいマップ</button>
        <input id="file-input" type="file" accept="application/json" hidden />
      </div>
    </header>

    <main>
      <aside class="sidebar">
        <section>
          <p class="eyebrow">操作</p>
          <button id="add-child" class="tool"><span>↳</span> 子ノードを追加 <kbd>Tab</kbd></button>
          <button id="add-sibling" class="tool"><span>＋</span> 同階層を追加 <kbd>Enter</kbd></button>
          <button id="delete-node" class="tool danger"><span>⌫</span> ノードを削除 <kbd>Del</kbd></button>
          <button id="cut-node" class="tool"><span>✂</span> ノードを切り取り</button>
          <button id="paste-node" class="tool" disabled><span>↳</span> ここに貼り付け</button>
        </section>
        <section>
          <p class="eyebrow">表示</p>
          <div class="zoom-row"><button id="zoom-out">−</button><span id="zoom-label">100%</span><button id="zoom-in">＋</button></div>
          <button id="fit-view" class="tool"><span>⌗</span> 全体を表示</button>
          <div class="layout-buttons" aria-label="レイアウトの切り替え">
            <button id="auto-layout" class="tool active"><span>⌘</span> ツリー</button>
            <button id="horizontal-layout" class="tool"><span>⇢</span> 横展開</button>
          </div>
        </section>
        <section class="node-options">
          <p class="eyebrow">選択中のノード</p>
          <label>色 <span id="color-picker" class="color-picker"><button data-color="" aria-label="色なし" title="色なし">×</button><button data-color="#6856e9" aria-label="紫"></button><button data-color="#eb6a7a" aria-label="赤"></button><button data-color="#e9a33b" aria-label="黄"></button><button data-color="#43a77b" aria-label="緑"></button><button data-color="#438bd5" aria-label="青"></button></span></label>
          <label>アイコン <select id="node-icon" disabled><option value="">なし</option><option value="💡">💡 アイデア</option><option value="✓">✓ タスク</option><option value="★">★ 重要</option><option value="?">? 調査</option></select></label>
          <label>メモ <textarea id="node-note" rows="3" placeholder="補足メモを入力" disabled></textarea></label>
        </section>
        <section class="search-panel">
          <p class="eyebrow">検索</p>
          <input id="node-search" type="search" placeholder="ノード・メモを検索" aria-label="ノードを検索" />
          <div id="search-results" aria-live="polite"></div>
        </section>
        <section class="tips">
          <p class="eyebrow">ヒント</p>
          <p>ノードをダブルクリックして編集。ドラッグして自由に配置できます。</p>
        </section>
      </aside>
      <section id="canvas" aria-label="マインドマップのキャンバス" tabindex="0">
        <svg id="connections" aria-hidden="true"></svg>
        <div id="node-layer"></div>
        <aside id="note-preview" class="note-preview" aria-live="polite" hidden>
          <p class="note-preview-title">補足メモ</p>
          <p id="note-preview-node"></p>
          <p id="note-preview-text"></p>
        </aside>
        <div class="canvas-hint">ホイールで拡大・縮小　／　空白をドラッグして移動</div>
      </section>
    </main>
    <div id="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
